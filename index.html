<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>BranchPulse</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-shell" aria-hidden="true">BranchPulse</div>
    <style>
      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        font-family: "Inter Variable", Inter, "Segoe UI", system-ui, sans-serif;
        font-size: 2.25rem;
        font-weight: 800;
        color: rgb(255 255 255 / 0.94);
        pointer-events: none;
      }
      html.light #startup-shell {
        color: rgb(17 19 26 / 0.94);
      }
      #root:not(:empty) ~ #startup-shell {
        display: none;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
